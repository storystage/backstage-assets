# Blender Studio's characters (WP3.8; CC BY 4.0, "(CC) Blender Foundation | studio.blender.org"),
# with Blender, headless, from originals/blender-studio/studio.json, using storystage2's
# tools/backstage-sources/blender/studio.py, then added to Backstage with the same tools as every
# other source. Blender is a GPL build tool, never shipped.
#
# The files are fetched from Blender Studio's own download links (the owner's choice of 15 Nov 2026;
# its robots.txt allows ordinary clients) and checked against their pinned sha256. They are never
# committed: they're large, and each run's export is reproducible from them.
name: Blender Studio characters

on:
  workflow_dispatch:
    inputs:
      tools_ref:
        description: storystage2 branch or commit whose tools to use
        required: true
        default: main
  # A push to studio/<storystage2 ref> runs it with that ref's tools (dispatch needs the workflow on main).
  push:
    branches: ['studio/**']

permissions:
  contents: write

env:
  TOOLS_REF: ${{ inputs.tools_ref || github.ref_name }}
  BLENDER_SERIES: '4.5'
  BLENDER_VERSION: 4.5.14

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Which tools
        run: |
          ref="${TOOLS_REF#studio/}"
          echo "TOOLS_REF=$ref" >> "$GITHUB_ENV"
          echo "Tools: storystage2 $ref"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: assets
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storystage/storystage2
          ref: ${{ env.TOOLS_REF }}
          path: storystage2
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: storystage2/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: storystage2/.nvmrc
      - name: Install the tools
        working-directory: storystage2
        run: pnpm install --frozen-lockfile
      - name: The list
        run: |
          mkdir -p "$RUNNER_TEMP/studio"
          node -e '
            const s = require(process.argv[1]);
            for (const c of s.characters) {
              if (!/^[0-9a-f]{64}$/.test(c.sha256 || "")) throw new Error(`${c.name}: pin its sha256`);
              console.log([c.name, c.url, c.sha256, c.blend].join(" "));
            }
          ' "$GITHUB_WORKSPACE/assets/originals/blender-studio/studio.json" > "$RUNNER_TEMP/studio/list.txt"
          cat "$RUNNER_TEMP/studio/list.txt"
          key=$(cut -d' ' -f3 "$RUNNER_TEMP/studio/list.txt" | sort | sha256sum | cut -c1-16)
          echo "DOWNLOADS_KEY=studio-blender-${BLENDER_VERSION}-$key" >> "$GITHUB_ENV"
      # Blender and the characters' files are kept in the Actions cache, so a run downloads them only
      # when one changes: half a gigabyte each time is unkind to both servers (15 Nov 2026:
      # download.blender.org refused a run after several in a row).
      - name: Restore the downloads
        id: downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/downloads
          key: ${{ env.DOWNLOADS_KEY }}
          restore-keys: studio-blender-${{ env.BLENDER_VERSION }}-
      - name: Download what's missing
        run: |
          mkdir -p "$RUNNER_TEMP/downloads"
          cd "$RUNNER_TEMP/downloads"
          blender="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          [ -f "$blender" ] || curl -fsSL --retry 5 --retry-all-errors -o "$blender" "https://download.blender.org/release/Blender${BLENDER_SERIES}/$blender"
          while read -r name url sha blend; do
            if [ ! -f "$sha.zip" ]; then
              curl -fsSL --retry 5 --retry-all-errors -A "storystage-assets-build" -o "$name.zip" "$url"
              mv "$name.zip" "$sha.zip"
            fi
            echo "$sha  $sha.zip" | sha256sum -c - || { echo "::error::$name: not the pinned file"; exit 1; }
          done < "$RUNNER_TEMP/studio/list.txt"
          ls -la
      - name: Keep the downloads
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/downloads
          key: ${{ env.DOWNLOADS_KEY }}
      - name: Install Blender and unpack the characters
        timeout-minutes: 20
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 libegl1
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/downloads/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -C "$RUNNER_TEMP/blender"
          echo "BLENDER=$RUNNER_TEMP/blender/blender-${BLENDER_VERSION}-linux-x64/blender" >> "$GITHUB_ENV"
          while read -r name url sha blend; do
            unzip -q "$RUNNER_TEMP/downloads/$sha.zip" -d "$RUNNER_TEMP/studio/$name"
          done < "$RUNNER_TEMP/studio/list.txt"
      - name: Export them
        run: |
          models="$GITHUB_WORKSPACE/assets/generated/blender-studio"
          previews="$GITHUB_WORKSPACE/assets/previews/blender-studio"
          mkdir -p "$models" "$previews"
          while read -r name url sha blend; do
            "$BLENDER" -b "$RUNNER_TEMP/studio/$name/$blend" --python-exit-code 1 \
              --python storystage2/tools/backstage-sources/blender/studio.py -- \
              export assets/originals/blender-studio/studio.json "$name" "$models" "$previews"
          done < "$RUNNER_TEMP/studio/list.txt"
          cp "$models"/*-report.json "$previews/"
      - name: Add them to Backstage
        working-directory: storystage2
        run: node tools/backstage-sources/src/cli.ts ../assets --only blender-studio
      - name: Push a branch for review
        working-directory: assets
        run: |
          rm -rf generated
          branch="exported/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "Export Blender Studio's characters (tools: storystage2 ${TOOLS_REF})"
          git push origin "$branch"
          echo "Pushed $branch"
